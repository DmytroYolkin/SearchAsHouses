# Tool settings only: this repo is not an installable Python package.

[tool.ruff]
line-length = 100
# Lowest Python version the code must run on (Azure ML images often use 3.10).
target-version = "py310"
extend-exclude = ["searchashouses/report", "searchashouses/data"]

[tool.ruff.lint]
# E/W = pycodestyle errors and warnings, F = pyflakes (unused imports, undefined names), I = import order.
select = ["E", "W", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["searchashouses/tests"]
addopts = "-ra"
