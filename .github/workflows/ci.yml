# CI: lint and unit tests on every pull request to main and every push to main (issue #31).
# The repo is public, so this uses `pull_request` (never `pull_request_target`): code from a
# fork PR runs with a read-only token and without any secrets.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR or branch cancels the older, now outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            searchashouses/azureml/setup/requirements.txt
      # The setup scripts' packages are installed too, so tests/setup really runs instead of skipping.
      - run: pip install -r requirements-dev.txt -r searchashouses/azureml/setup/requirements.txt
      - run: pytest
